# Provider-neutral ingress example. Replace example.invalid only at deployment time.
# TLS termination is external; the Node relay still enforces Host separation itself.

# control.example.invalid -> 127.0.0.1:8787 (HTTP only, /control/v1/* and /healthz)
# connector.example.invalid -> 127.0.0.1:8787 (WebSocket upgrade only, /connector)
# *.apps.example.invalid -> 127.0.0.1:8787 (Mini App static/read-only routes only)
# Never route control or connector surfaces through the tenant wildcard as a convenience fallback.
